name: Release

"on":
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  build-release:
    name: Build and publish MacPaper
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app
        run: ./scripts/build.sh

      - name: Package app
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p work/release
          ditto -c -k --sequesterRsrc --keepParent outputs/MacPaper.app "work/release/MacPaper-${version}-macOS-arm64.zip"
          shasum -a 256 "work/release/MacPaper-${version}-macOS-arm64.zip" > "work/release/MacPaper-${version}-macOS-arm64.zip.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          tag="v${version}"
          notes="MacPaper ${version}

- Adds the Never option for wallpaper switching.
- Keeps the current wallpaper fixed until you change it manually.

SHA-256:
$(cat "work/release/MacPaper-${version}-macOS-arm64.zip.sha256")"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "work/release/MacPaper-${version}-macOS-arm64.zip" --clobber
            gh release edit "$tag" --title "MacPaper ${version}" --notes "$notes" --latest
          else
            gh release create "$tag" "work/release/MacPaper-${version}-macOS-arm64.zip" --title "MacPaper ${version}" --notes "$notes" --latest
          fi
