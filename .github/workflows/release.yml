name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, without the leading v
        required: true
        default: 2.1.1

permissions:
  contents: write

jobs:
  build-release:
    name: Build and publish MacPaper
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app
        run: ./scripts/build.sh

      - name: Package app
        run: |
          mkdir -p work/release
          ditto -c -k --sequesterRsrc --keepParent outputs/MacPaper.app "work/release/MacPaper-${{ inputs.version }}-macOS-arm64.zip"
          shasum -a 256 "work/release/MacPaper-${{ inputs.version }}-macOS-arm64.zip" > "work/release/MacPaper-${{ inputs.version }}-macOS-arm64.zip.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ inputs.version }}"
          notes="MacPaper ${{ inputs.version }}

- Adds the Never option for wallpaper switching.
- Keeps the current wallpaper fixed until you change it manually.

SHA-256:
$(cat "work/release/MacPaper-${{ inputs.version }}-macOS-arm64.zip.sha256")"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "work/release/MacPaper-${{ inputs.version }}-macOS-arm64.zip" --clobber
            gh release edit "$tag" --title "MacPaper ${{ inputs.version }}" --notes "$notes" --latest
          else
            gh release create "$tag" "work/release/MacPaper-${{ inputs.version }}-macOS-arm64.zip" --title "MacPaper ${{ inputs.version }}" --notes "$notes" --latest
          fi
